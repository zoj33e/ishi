headline: "ลงแล้วหมากเราติดอาตาริเอง"
explanation:
  - "พอลงที่ {played_move} หมาก {stones} ของเราที่มีสามเหลี่ยม เหลือลมหายใจช่องเดียวที่ {last_liberty}"
  - "ฝ่ายตรงข้ามลงตรงนั้นก็กินได้เลย"
new_term: "แบบนี้เรียกว่าทำตัวเองให้ติดอาตาริ คือลงแล้วหมากตัวเองเหลือลมหายใจช่องเดียว"
question: "ตรงไหนน่าจะเป็นตาเดินที่ดีกว่า"
hints:
  - "ก่อนลง ลองนับดูว่าลงแล้วหมากเราจะเหลือลมหายใจกี่ช่อง"
  - "คำตอบอยู่ในบริเวณที่ไฮไลต์ไว้"
takeaway: "ให้นับลมหายใจหลังจากลงแล้ว ไม่ใช่ก่อนลงนะ"
