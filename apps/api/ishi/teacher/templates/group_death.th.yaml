headline: "ตานี้ทำให้หมากกลุ่มนี้ตาย"
explanation:
  - "ก่อนเราลง {played_move} หมาก {stones} ที่มีสามเหลี่ยมยังรอดอยู่"
  - "แต่หลังจากนั้น ฝ่ายตรงข้ามกันไม่ให้สร้างสองตาได้ หมากกลุ่มนี้เลยตาย"
new_term: "กลุ่มหมากต้องมีสองตาถึงจะรอดได้ตลอด"
question: "หมากกลุ่มนี้ต้องการจุดไหน"
hints:
  - "หมากกลุ่มนี้จะสร้างตาได้ตรงไหน"
  - "คำตอบอยู่ในบริเวณที่ไฮไลต์ไว้"
takeaway: "ถ้าหมากกลุ่มไหนมีพื้นที่น้อย ให้รีบทำให้มีสองตาก่อนนะ"
