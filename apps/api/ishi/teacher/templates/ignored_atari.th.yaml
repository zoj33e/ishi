headline: "หมาก {stones} ของเรากำลังลำบาก"
explanation:
  - "หมาก {stones} ของเราที่มีสามเหลี่ยม เหลือลมหายใจช่องเดียว แบบนี้เรียกว่าอาตาริ"
  - "หมากที่ติดอาตาริ ฝ่ายตรงข้ามกินได้ในตาถัดไปเลย"
  - "แต่เราไปลงที่ {played_move} หมากกลุ่มนี้เลยยังอยู่ในอันตราย"
new_term: "อาตาริ (atari) คือตอนที่หมากเหลือลมหายใจแค่ช่องเดียว"
question: "ควรลงตรงไหนถึงจะช่วยหมากกลุ่มนี้ได้"
hints:
  - "ทำยังไงให้หมากของเรามีลมหายใจเพิ่มขึ้น"
  - "คำตอบอยู่ในบริเวณที่ไฮไลต์ไว้"
takeaway: "เมื่อหมากของเราติดอาตาริ ให้ถามตัวเองก่อนว่าช่วยได้ไหม และคุ้มที่จะช่วยหรือเปล่านะ"
