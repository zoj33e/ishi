headline: "ตานี้กินหมาก {stones} ได้เลย"
explanation:
  - "หมากฝ่ายตรงข้าม {stones} ที่มีสามเหลี่ยม เหลือลมหายใจแค่ช่องเดียว"
  - "ถ้าเราลงปิดลมหายใจช่องสุดท้ายนั้น ก็กินได้ทันที"
  - "แต่เราไปลงที่ {played_move} แทน"
new_term: "การกินคือการปิดลมหายใจช่องสุดท้ายของกลุ่มหมาก"
question: "ลองหาดูว่าควรลงตรงไหนถึงจะกินได้"
hints:
  - "ลองนับลมหายใจของหมากที่มีสามเหลี่ยมดู"
  - "คำตอบอยู่ในบริเวณที่ไฮไลต์ไว้"
takeaway: "ก่อนลงทุกครั้ง ดูก่อนว่ามีหมากฝ่ายตรงข้ามติดอาตาริอยู่ไหมนะ"
variants:
  short:
    explanation:
      - "หมากฝ่ายตรงข้าม {stones} ที่มีสามเหลี่ยม เหลือลมหายใจแค่สองช่อง"
      - "เราไล่อาตาริต่อไปเรื่อย ๆ จนมันหนีไม่รอดได้"
      - "แต่เราไปลงที่ {played_move} แทน"
    hints:
      - "อาตาริด้านไหนที่ทำให้มันได้ลมหายใจเพิ่มไม่ได้"
      - "คำตอบอยู่ในบริเวณที่ไฮไลต์ไว้"
