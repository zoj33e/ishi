# Nudges (M7): ถามก่อนผู้เรียนลงจริง จึงไม่บอกคำตอบ `{played_move}` คือหมากเงา
headline: "เดี๋ยวก่อน ลองดูอีกทีนะ"
explanation:
  - "ก่อนลงที่ {played_move} ลองดูหมากรอบ ๆ ก่อน"
  - "มีเรื่องสำคัญกว่าอยู่ใกล้ ๆ ตรงนี้"
question: "มีตาที่ดีกว่านี้ไหม?"
hints:
  - "ลองดูหมากที่อยู่ใกล้ {played_move}"
  - "ลองดูในบริเวณที่ไฮไลต์ไว้"
takeaway: "ดูให้ดีก่อนลง เป็นนิสัยของคนเล่นเก่ง"
variants:
  missed_capture:
    question: "มีหมากฝ่ายตรงข้ามที่เหลือลมหายใจน้อยอยู่ไหม?"
    hints:
      - "ลองนับลมหายใจของหมากฝ่ายตรงข้ามแถวนี้"
      - "ลองดูในบริเวณที่ไฮไลต์ไว้"
  ignored_atari:
    question: "ตอนนี้หมากของเราปลอดภัยดีไหม?"
    hints:
      - "ลองนับลมหายใจของหมากเราที่อยู่ใกล้ ๆ"
      - "ลองดูในบริเวณที่ไฮไลต์ไว้"
  self_atari:
    question: "ถ้าลงตรงนี้ หมากของเราจะเหลือลมหายใจกี่ช่อง?"
    hints:
      - "นับลมหายใจของหมากเราหลังลงที่ {played_move}"
      - "ลองดูในบริเวณที่ไฮไลต์ไว้"
  ladder:
    question: "ถ้ากลายเป็นการไล่จับกัน ใครจะชนะ?"
    hints:
      - "ลองอ่านการไล่ทีละตาจนจบ"
      - "ลองดูในบริเวณที่ไฮไลต์ไว้"
  cut_disconnect:
    question: "หลังตานี้ อีกฝ่ายจะแยกหมากของเราออกจากกันได้ไหม?"
    hints:
      - "หาจุดที่อีกฝ่ายจะตัดได้"
      - "ลองดูในบริเวณที่ไฮไลต์ไว้"
  group_death:
    question: "กลุ่มของเรายังมีที่พอสำหรับสองตาไหม?"
    hints:
      - "จุดสำคัญที่ทำให้กลุ่มนี้รอดอยู่ตรงไหน?"
      - "ลองดูในบริเวณที่ไฮไลต์ไว้"
