headline: "หนีทางนี้ไม่รอด เพราะติดบันได"
explanation:
  - "หมาก {stones} ของเราที่มีสามเหลี่ยม พยายามหนีด้วย {played_move}"
  - "แต่ฝ่ายตรงข้ามไล่อาตาริแบบซิกแซกได้ตลอด เริ่มที่ {ladder_start} แบบนี้เรียกว่าบันได"
  - "สุดท้ายหมากของเราก็ถูกกิน"
new_term: "บันได (ladder) คือการไล่กินแบบซิกแซก โดยทุกตาเป็นอาตาริ"
question: "ตรงนั้นควรทำอะไรแทนดี"
hints:
  - "ถ้าหนีไป บันไดจะจับหมากเราได้ไหม"
  - "คำตอบอยู่ในบริเวณที่ไฮไลต์ไว้"
takeaway: "ก่อนหนีจากอาตาริ ลองอ่านบันไดให้จบก่อนนะ"
variants:
  broken_ladder_chase:
    headline: "ไล่บันไดตรงนี้จับไม่ได้"
    explanation:
      - "เราลง {played_move} เพื่อไล่บันไดหมาก {stones} ที่มีสามเหลี่ยม"
      - "แต่ตรงนี้บันไดไม่ได้ผล หมากฝ่ายตรงข้ามเลยหนีรอดไปได้"
    question: "ตรงนั้นควรลงตรงไหนดีกว่า"
    hints:
      - "ลองไล่ตามทีละตาดู หมากหนีออกไปทางไหน"
      - "คำตอบอยู่ในบริเวณที่ไฮไลต์ไว้"
    takeaway: "จะไล่บันได ให้อ่านให้จบก่อนว่าจับได้จริง"
