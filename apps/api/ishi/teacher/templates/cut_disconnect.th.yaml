headline: "หมากของเราโดนตัดได้"
explanation:
  - "หมากสองกลุ่มของเราที่มีสามเหลี่ยม ต่อกันได้แค่จุดเดียว"
  - "พอเราไปลง {played_move} ฝ่ายตรงข้ามก็ตัดแยกสองกลุ่มนี้ได้ ทำให้อ่อนแอทั้งคู่"
new_term: "การตัด คือการแยกหมากที่เกือบจะต่อกันอยู่แล้วออกจากกัน"
question: "ควรต่อหมากตรงไหน"
hints:
  - "หาจุดที่หมากทั้งสองกลุ่มแตะกันอยู่"
  - "คำตอบอยู่ในบริเวณที่ไฮไลต์ไว้"
takeaway: "ถ้าหมากสองกลุ่มของเราต่อกันได้แค่จุดเดียว ให้คิดถึงการต่อก่อนนะ"
